<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Tonik · Private</title>
<style>*{box-sizing:border-box;margin:0}
html{background:#795afe}
body{font:16px/1.5 Helvetica,"Helvetica Neue",Arial,sans-serif;color:#1b0f3f;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#795afe;position:relative;overflow:hidden}
html:not(.ready) .card,html:not(.ready) .stk{visibility:hidden}
.c1{position:absolute;right:-110px;top:-110px;width:420px;height:420px;border-radius:50%;background:#ffffff24}
.c2{position:absolute;left:-60px;bottom:-80px;width:260px;height:260px;border-radius:50%;background:#ffd84d}
.stk{position:absolute;background:#fff;font-weight:700;font-size:14px;padding:9px 16px;border-radius:99px;box-shadow:0 8px 20px #2a176940}
.s1{right:9%;top:14%;transform:rotate(6deg)}.s2{left:8%;top:22%;transform:rotate(-5deg);background:#bdf3dc}
.card{position:relative;background:#fff;border-radius:32px;padding:34px 30px 28px;width:100%;max-width:400px;box-shadow:0 24px 60px #2a176955}
.card img{height:34px;margin-bottom:20px;display:block}
h1{font-size:24px;line-height:1.15;letter-spacing:-.02em;margin-bottom:8px}
p.s{font-size:15px;color:#5f5883;margin-bottom:20px}
.f{display:flex;align-items:center;gap:8px;border:2px solid #e6e0fa;border-radius:99px;padding:0 8px 0 18px;background:#fff;height:50px}
.f:focus-within{border-color:#795afe}
.f input{border:0;outline:0;flex:1;min-width:0;height:44px;font:inherit;font-size:16px;background:transparent;color:#1b0f3f}
.eye{border:0;background:transparent;cursor:pointer;font:700 13px Helvetica,Arial,sans-serif;color:#795afe;padding:8px 12px;border-radius:99px}
.eye:hover{background:#efeaff}
.err{font-size:14px;color:#c0341d;min-height:22px;margin:8px 6px 6px;font-weight:700}
button.go{width:100%;background:#1b0f3f;color:#fff;border:0;border-radius:99px;height:52px;font:700 16px Helvetica,Arial,sans-serif;cursor:pointer}
button.go:hover{transform:translateY(-2px)}button.go:disabled{opacity:.7;cursor:wait;transform:none}
.hint{font-size:13px;color:#5f5883;text-align:center;margin-top:14px}
:focus-visible{outline:3px solid #ffd84d;outline-offset:2px}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shk{animation:shk .4s}
@media(max-width:700px){.stk{display:none}}</style></head><body>
